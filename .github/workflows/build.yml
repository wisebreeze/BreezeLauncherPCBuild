name: 'Desktop CI'

# This workflow lives in the public BreezeLauncherPCBuild repo purely to
# consume GitHub Actions free minutes (public repos get unlimited minutes;
# private repos are capped at 2000/min/month).
# Source code is cloned from the private BreezeLauncherPC repo at build time.
#
# Triggers:
#   repository_dispatch (auto, fired by BreezeLauncherBackend webhook
#     when the private BreezeLauncherPC repo is pushed):
#     Builds all platforms and uploads to the `artifact` rolling release.
#   workflow_dispatch (manual): same build, for ad-hoc triggers.
#
# Build outputs:
#   win-x64     -> BreezeLauncher-setup.exe        (custom Avalonia installer)
#   linux-x64   -> breezelauncher_<ver>_amd64.deb + BreezeLauncher-<ver>-1.x86_64.rpm
#   linux-arm64 -> breezelauncher_<ver>_arm64.deb + BreezeLauncher-<ver>-1.aarch64.rpm
# All assets are published to THIS repo's `artifact` rolling release.

on:
  workflow_dispatch:
  repository_dispatch:
    types: [upstream-changed]

env:
  ARTIFACT_RELEASE_TAG: "artifact"
  PRIVATE_REPO: "wisebreeze/BreezeLauncherPC"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_GENERATE_ASPNET_CERTIFICATE: "false"

jobs:
  build:
    name: Build ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-22.04
            rid: linux-x64
            extra-rids: linux-arm64

    steps:
      - name: Checkout private source repo
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        shell: bash
        run: |
          git clone --filter=blob:none --depth 1 --branch main "https://x-access-token:${PRIVATE_REPO_TOKEN}@github.com/${PRIVATE_REPO}.git" .
          git config user.name "wisebreeze"
          git config user.email "wisebreeze@users.noreply.github.com"

      - name: Read version from csproj
        id: version
        shell: bash
        run: |
          VERSION=$(grep -oP '<Version>\K[^<]+' BreezeLauncherPC.csproj || echo "0.0.0")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"

      # .NET 10 SDK + runtimes are preinstalled on windows-latest and
      # ubuntu-22.04 runner images, so no setup-dotnet step is needed.
      # NuGet packages are restored by 'dotnet restore' below; caching
      # them saves ~10s but the image's own NuGet cache is usually warm.

      - name: Restore NuGet packages
        shell: bash
        run: dotnet restore

      - name: Publish (framework-dependent single-file)
        shell: bash
        run: |
          # Framework-dependent: relies on system .NET 10 Desktop Runtime.
          # Package is ~30MB instead of ~150MB. Users need .NET 10
          # Desktop Runtime installed (the installer will prompt if missing).
          RIDS="${{ matrix.rid }}"
          if [ -n "${{ matrix.extra-rids }}" ]; then
            RIDS="$RIDS ${{ matrix.extra-rids }}"
          fi
          for rid in $RIDS; do
            echo ">>> Publishing $rid..."
            dotnet publish -c Release -r "$rid" --self-contained false \
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
              -p:DebugType=embedded -o "publish-$rid" --no-restore
          done

      # ── Windows: custom Avalonia installer ───────────────────────
      # 1. Zip the app publish output into app.zip
      # 2. Embed app.zip into the installer project as a manifest resource
      # 3. Publish the installer (framework-dependent, ~5MB)
      # The installer also serves as the uninstaller (via --uninstall flag),
      # so no separate uninstaller exe is needed.
      - name: Build custom installer (Windows)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          # 1. Zip the app (Windows runner has no `zip` CLI — use .NET ZipFile).
          #    The publish/ dir was already produced by the previous step.
          # Remove .pdb files first, then zip.
          Get-ChildItem publish -Recurse -Filter *.pdb | Remove-Item -Force
          [System.IO.Compression.ZipFile]::CreateFromDirectory(
            (Resolve-Path 'publish').Path,
            (Join-Path (Get-Location) 'app.zip'),
            [System.IO.Compression.CompressionLevel]::Optimal,
            $false)

          # 2. Copy app.zip into installer project's Embedded/
          New-Item -ItemType Directory -Force -Path installer/BreezeLauncherInstaller/Embedded | Out-Null
          Copy-Item app.zip installer/BreezeLauncherInstaller/Embedded/app.zip -Force

          # 3. Publish installer (framework-dependent, embeds app.zip)
          dotnet publish installer/BreezeLauncherInstaller/BreezeLauncherInstaller.csproj `
            -c Release -r win-x64 --self-contained false `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -o installer-publish

          # 4. Rename to final name
          Move-Item installer-publish/BreezeLauncherInstaller.exe BreezeLauncher-setup.exe -Force

      # ── Linux: .deb + .rpm via fpm ────────────────────────────────
      - name: Install fpm
        if: startsWith(matrix.rid, 'linux')
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ruby ruby-dev rpm
          sudo gem install fpm --no-document

      - name: Build deb and rpm packages
        if: startsWith(matrix.rid, 'linux')
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          chmod +x packaging/linux/build-packages.sh
          RIDS="${{ matrix.rid }}"
          if [ -n "${{ matrix.extra-rids }}" ]; then
            RIDS="$RIDS ${{ matrix.extra-rids }}"
          fi
          for rid in $RIDS; do
            echo ">>> Building packages for $rid..."
            rm -rf publish
            cp -r "publish-$rid" publish
            packaging/linux/build-packages.sh "$rid" "$VERSION"
            rm -rf publish
          done

      - name: List build outputs
        shell: bash
        run: |
          echo "=== Build outputs ==="
          ls -lh BreezeLauncher-setup.exe *.deb *.rpm 2>/dev/null || echo "(no files found)"

      - name: Ensure artifact release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release create ${{ env.ARTIFACT_RELEASE_TAG }} \
            --repo "${{ github.repository }}" \
            --title "BreezeLauncher Desktop Build Artifacts" \
            --notes "Automated build artifacts from CI. The latest desktop installers are always attached to this release." \
            --draft=false --prerelease=false 2>/dev/null || gh release view ${{ env.ARTIFACT_RELEASE_TAG }} --repo "${{ github.repository }}" >/dev/null

      - name: Upload assets to artifact release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          for f in BreezeLauncher-setup.exe *.deb *.rpm; do
            [ -f "$f" ] || continue
            echo "Uploading $f..."
            gh release delete-asset ${{ env.ARTIFACT_RELEASE_TAG }} "$f" --repo "${{ github.repository }}" 2>/dev/null || true
            gh release upload ${{ env.ARTIFACT_RELEASE_TAG }} "$f" --clobber --repo "${{ github.repository }}"
          done
          echo "All assets uploaded."

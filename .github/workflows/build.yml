name: 'Desktop CI'

# This workflow lives in the public BreezeLauncherPCBuild repo purely to
# consume GitHub Actions free minutes (public repos get unlimited minutes;
# private repos are capped at 2000/min/month).
# Source code is cloned from the private BreezeLauncherPC repo at build time.
#
# Triggers:
#   repository_dispatch (auto, fired by BreezeLauncherBackend webhook
#     when the private BreezeLauncherPC repo is pushed):
#     Builds all platforms and uploads to the `artifact` rolling release.
#   workflow_dispatch (manual): same build, optionally on a specific ref.
#
# Build outputs (Tauri bundles, platform-dependent):
#   win-x64     -> *.msi, *-setup.exe (NSIS)
#   linux-x64   -> *.deb, *.rpm, *.AppImage
#   macos-arm64 -> *.dmg (Apple Silicon)
#   macos-x64   -> *.dmg (Intel)
# All assets are published to THIS repo's `artifact` rolling release.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch / tag / commit SHA in BreezeLauncherPC to build from'
        required: false
        default: 'main'
  repository_dispatch:
    types: [upstream-changed]

env:
  ARTIFACT_RELEASE_TAG: "artifact"
  PRIVATE_REPO: 'wisebreeze/BreezeLauncherPC'

jobs:
  build:
    name: Build ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-26.04
            rid: linux-x64
          - os: macos-latest
            rid: macos-arm64
            target: aarch64-apple-darwin
          - os: macos-26-intel
            rid: macos-x64
            target: x86_64-apple-darwin

    steps:
      - name: Checkout private source repo
        uses: actions/checkout@v5
        with:
          repository: ${{ env.PRIVATE_REPO }}
          ref: ${{ github.event.inputs.ref || 'main' }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: BreezeLauncherPC
          fetch-depth: 1

      # All runners (windows-latest, ubuntu-26.04, macos-26) ship Node.js
      # 24 pre-installed, so setup-node is no longer needed.

      # Cache node_modules directly. Keyed on package-lock.json hash + OS.
      # On hit, npm ci is skipped entirely (saves ~15-30s).
      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v5
        with:
          path: BreezeLauncherPC/node_modules
          key: node_modules-${{ matrix.rid }}-${{ hashFiles('BreezeLauncherPC/package-lock.json') }}

      # Rust is pre-installed via rustup, but rust-toolchain pins a
      # consistent version and integrates with Swatinem/rust-cache.
      - name: Setup Rust (with target cache)
        uses: dtolnay/rust-toolchain@stable

      # Cache Rust build artifacts. Keyed on Cargo.lock hash + target.
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'BreezeLauncherPC/src-tauri'
          key: ${{ matrix.rid }}
          cache-targets: true

      # macOS: add the cross-compile target so Tauri can build for it.
      # (The host runner already has its native target; this adds the
      # other one. For split builds each job only builds its own target,
      # so this is a no-op on the matching runner.)
      - name: Add Rust target
        if: runner.os == 'macOS'
        run: rustup target add ${{ matrix.target }}

      # Linux: Tauri requires webkit2gtk and other system deps.
      # Cached via actions/cache so a second run skips apt entirely.
      - name: Cache apt packages
        if: runner.os == 'Linux'
        id: cache-apt
        uses: actions/cache@v5
        with:
          path: ~/apt-pkgs
          key: apt-ubuntu-26.04-v1

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if [ "${{ steps.cache-apt.outputs.cache-hit }}" = "true" ]; then
            echo "Restoring apt packages from cache..."
            sudo apt-get update -qq
            sudo apt-get install -y --no-download \
              libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf 2>/dev/null || {
                echo "Cache restore failed, falling back to full install"
                sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
              }
          else
            echo "Installing apt packages..."
            sudo apt-get update
            sudo apt-get install -y \
              libwebkit2gtk-4.1-dev \
              libgtk-3-dev \
              libayatana-appindicator3-dev \
              librsvg2-dev \
              patchelf
            # Cache the downloaded .deb files for next run
            mkdir -p ~/apt-pkgs
            cp /var/cache/apt/archives/*.deb ~/apt-pkgs/ 2>/dev/null || true
          fi

      - name: Install npm dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        working-directory: BreezeLauncherPC
        run: npm ci

      # Full Tauri build (frontend + Rust + bundle).
      # Tauri runs beforeBuildCommand (npm run build) automatically.
      - name: Tauri build
        working-directory: BreezeLauncherPC
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            npm run tauri build -- --target ${{ matrix.target }}
          else
            npm run tauri build
          fi
        shell: bash
        env:
          # CI builds don't need code signing.
          APPLE_SIGNING_ENABLED: 'false'
          TAURI_SIGNING_PRIVATE_KEY: ''

      # Compress the Linux AppImage with upx (~50-60% size reduction).
      - name: Compress AppImage with upx
        if: runner.os == 'Linux'
        shell: bash
        working-directory: BreezeLauncherPC
        run: |
          APPIMAGE=$(find src-tauri/target/release/bundle/appimage -name '*.AppImage' -type f | head -1)
          if [ -z "$APPIMAGE" ]; then
            echo "No AppImage found — skipping upx"
            exit 0
          fi
          BEFORE=$(stat -c%s "$APPIMAGE")
          echo "Before upx: $((BEFORE / 1024 / 1024)) MB"
          sudo apt-get install -y -qq upx-ucl
          upx --best --lzma "$APPIMAGE" || echo "upx failed (non-fatal)"
          AFTER=$(stat -c%s "$APPIMAGE")
          echo "After upx:  $((AFTER / 1024 / 1024)) MB"

      - name: List build outputs
        if: always()
        shell: bash
        working-directory: BreezeLauncherPC
        run: |
          echo "=== Tauri build outputs ==="
          find src-tauri/target -path '*/bundle/*' -type f 2>/dev/null || echo "(no bundle files)"

      # ── Upload to the `artifact` rolling release ──────────────────
      # All bundle files (msi, exe, deb, rpm, AppImage, dmg) are uploaded
      # to the same rolling release tag, replacing any previous versions.
      - name: Ensure artifact release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release create ${{ env.ARTIFACT_RELEASE_TAG }} \
            --repo "${{ github.repository }}" \
            --title "BreezeLauncher Desktop Build Artifacts" \
            --notes "Automated build artifacts from CI. The latest desktop installers are always attached to this release." \
            --draft=false --prerelease=false 2>/dev/null || gh release view ${{ env.ARTIFACT_RELEASE_TAG }} --repo "${{ github.repository }}" >/dev/null

      - name: Upload assets to artifact release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        working-directory: BreezeLauncherPC
        run: |
          # macOS builds land in target/<arch>-apple-darwin/release/bundle;
          # Windows/Linux in target/release/bundle. Find whichever exists.
          BUNDLE_DIR=$(find src-tauri/target -type d -path '*/release/bundle' | head -1)
          if [ -z "$BUNDLE_DIR" ]; then
            echo "No bundle directory — nothing to upload"
            exit 0
          fi
          echo "Bundle dir: $BUNDLE_DIR"
          # Collect all installable artifacts (skip intermediate files).
          shopt -s nullglob
          FILES=(
            "$BUNDLE_DIR"/msi/*.msi
            "$BUNDLE_DIR"/nsis/*-setup.exe
            "$BUNDLE_DIR"/deb/*.deb
            "$BUNDLE_DIR"/rpm/*.rpm
            "$BUNDLE_DIR"/appimage/*.AppImage
            "$BUNDLE_DIR"/dmg/*.dmg
          )
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No installable artifacts found"
            exit 0
          fi
          for f in "${FILES[@]}"; do
            BASENAME=$(basename "$f")
            echo "Uploading $BASENAME..."
            # Delete any existing asset with the same name first, then
            # upload. Retry up to 3 times to handle the race where
            # parallel platform jobs upload to the same rolling release.
            for attempt in 1 2 3; do
              gh release delete-asset ${{ env.ARTIFACT_RELEASE_TAG }} "$BASENAME" --repo "${{ github.repository }}" --yes 2>/dev/null || true
              if gh release upload ${{ env.ARTIFACT_RELEASE_TAG }} "$f" --clobber --repo "${{ github.repository }}" 2>/dev/null; then
                echo "  uploaded (attempt $attempt)"
                break
              fi
              echo "  attempt $attempt failed, retrying in $((attempt * 5))s..."
              sleep $((attempt * 5))
            done
          done
          echo "All assets uploaded."

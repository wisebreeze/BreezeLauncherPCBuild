name: 'Desktop CI'

# This workflow lives in the public BreezeLauncherPCBuild repo purely to
# consume GitHub Actions free minutes (public repos get unlimited minutes;
# private repos are capped at 2000/min/month).
# Source code is cloned from the private BreezeLauncherPC repo at build time.
#
# Triggers:
#   repository_dispatch (auto, fired by BreezeLauncherBackend webhook
#     when the private BreezeLauncherPC repo is pushed):
#     Builds all platforms and uploads to the `artifact` rolling release.
#   workflow_dispatch (manual): same build, optionally on a specific ref.
#
# Build outputs (platform-dependent):
#   win-x64     -> BreezeLauncher.exe (portable, no installer)
#   linux-x64   -> *.deb, *.rpm, *.AppImage
#   macos-arm64 -> *.dmg (Apple Silicon)
#   macos-x64   -> *.dmg (Intel)
# All assets are published to THIS repo's `artifact` rolling release.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch / tag / commit SHA in BreezeLauncherPC to build from'
        required: false
        default: 'main'
  repository_dispatch:
    types: [upstream-changed]

env:
  ARTIFACT_RELEASE_TAG: "artifact"
  PRIVATE_REPO: 'wisebreeze/BreezeLauncherPC'

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows x64
            rid: win-x64
          - os: ubuntu-26.04
            name: Linux x64
            rid: linux-x64
          - os: macos-latest
            name: macOS arm64
            rid: macos-arm64
          - os: macos-26-intel
            name: macOS x64
            rid: macos-x64

    steps:
      - name: Checkout private source repo
        uses: actions/checkout@v5
        with:
          repository: ${{ env.PRIVATE_REPO }}
          ref: ${{ github.event.inputs.ref || 'main' }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: BreezeLauncherPC
          fetch-depth: 1

      # Go 1.26+ is required by go.mod. setup-go reads the exact version
      # from go.mod and caches ~/go/pkg/mod keyed on go.sum.
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: BreezeLauncherPC/go.mod
          cache-dependency-path: BreezeLauncherPC/go.sum

      # setup-go caches the module download cache (~/go/pkg/mod) but NOT the
      # build cache (~/.cache/go-build on Linux/macOS, %LocalAppData%\go-build
      # on Windows). The build cache holds compiled package archives; a hit
      # turns a clean `go build` into an incremental one and saves 1-3 min on
      # dependency-heavy CGO builds (webkitgtk-6.0 bindings, chromedp, etc.).
      # Keyed on OS + arch + go.sum so a dependency bump invalidates it.
      - name: Cache Go build cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/AppData/Local/go-build
            ~/Library/Caches/go-build
          key: go-build-${{ matrix.rid }}-${{ hashFiles('BreezeLauncherPC/go.sum') }}
          restore-keys: |
            go-build-${{ matrix.rid }}-

      # wails3 CLI embeds a Taskfile runner, so `wails3 task <name>` works
      # without a separate `task` install. setup-go already added
      # $(go env GOPATH)/bin to PATH.
      #
      # Linux skips this: the wails3 binary itself is a Go program that
      # imports wails/v3/internal/operatingsystem, which uses cgo +
      # pkg-config to pull in gtk4 / webkitgtk-6.0 — so compiling wails3
      # on the host requires the same GTK4 dev packages the build needs.
      # The ubuntu runner doesn't have them, and we build inside Docker
      # anyway (where wails3 is already installed), so skip on Linux.
      - name: Install wails3 CLI
        if: runner.os != 'Linux'
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0

      # Cache frontend node_modules. Keyed on frontend/package-lock.json
      # hash + OS so a cache hit skips `npm install` entirely.
      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v5
        with:
          path: BreezeLauncherPC/frontend/node_modules
          key: node_modules-${{ matrix.rid }}-${{ hashFiles('BreezeLauncherPC/frontend/package-lock.json') }}

      # Linux: Wails v3 requires GTK >= 4.14 + WebKitGTK 6.0 for its CGO
      # webview backend. The ubuntu-26.04 runner image does not ship
      # libwebkitgtk-6.0-dev (and its GTK may be older than 4.14), so
      # installing system packages on the host is unreliable. Instead we
      # build inside the project's own Dockerfile.cross (Debian Trixie),
      # which has the exact verified package set. The image is cached so
      # subsequent runs skip the ~5 min Docker build.
      - name: Cache wails-cross Docker image
        if: runner.os == 'Linux'
        id: cache-docker
        uses: actions/cache@v5
        with:
          path: /tmp/wails-cross-ci.tar
          key: wails-cross-ci-v2-${{ hashFiles('BreezeLauncherPC/build/docker/Dockerfile.cross') }}

      - name: Build wails-cross Docker image
        if: runner.os == 'Linux'
        working-directory: BreezeLauncherPC
        shell: bash
        run: |
          if [ -f /tmp/wails-cross-ci.tar ]; then
            echo "Loading cached Docker image..."
            docker load < /tmp/wails-cross-ci.tar
          else
            echo "Building wails-cross base image from Dockerfile.cross..."
            docker build -t wails-cross -f build/docker/Dockerfile.cross .
            # Extend with wails3 CLI + packaging tools not in the base image.
            # dpkg-dev provides dpkg-architecture, needed by the linuxdeploy
            # GTK plugin (linuxdeploy-plugin-gtk.sh) when building AppImage.
            echo 'FROM wails-cross
            RUN apt-get update && apt-get install -y --no-install-recommends patchelf upx-ucl file dpkg-dev
            RUN go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0' | \
              docker build -t wails-cross-ci -
            docker save wails-cross-ci > /tmp/wails-cross-ci.tar
          fi

      - name: Install upx (host)
        if: runner.os == 'Linux'
        shell: bash
        run: sudo apt-get update -qq && sudo apt-get install -y -qq upx-ucl

      # Build + Package.
      #
      # Linux: a single `wails3 task package` call — the package task already
      # depends on build, so calling them separately re-runs the Go compile
      # twice (Taskfile state doesn't persist across docker run invocations).
      # Windows: build only (portable exe, no installer). macOS: package:dmg
      # which depends on package which depends on build.
      #
      # Linux runs inside the wails-cross-ci Docker container (Debian Trixie
      # with GTK4 + WebKitGTK 6.0) because the ubuntu runner doesn't have the
      # required -dev packages.
      - name: Build application
        if: runner.os == 'Windows'
        working-directory: BreezeLauncherPC
        shell: bash
        run: wails3 task build

      - name: Build & package application
        if: runner.os != 'Windows'
        working-directory: BreezeLauncherPC
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            docker run --rm --entrypoint bash \
              -v "$(pwd):/app" \
              -v "$(go env GOPATH)/pkg/mod:/go/pkg/mod" \
              -w /app \
              wails-cross-ci -c '
                export PATH="$PATH:/go/bin"
                wails3 task package
              '
            sudo chown -R "$(id -u):$(id -g)" bin frontend/bindings frontend/dist
          elif [ "${{ runner.os }}" = "macOS" ]; then
            # darwin:package depends on build, produces the .app bundle.
            wails3 task darwin:package
          fi

      # Compress the Linux AppImage with upx (~50-60% size reduction).
      - name: Compress AppImage with upx
        if: runner.os == 'Linux'
        shell: bash
        working-directory: BreezeLauncherPC
        run: |
          APPIMAGE=$(find bin -name '*.AppImage' -type f | head -1)
          if [ -z "$APPIMAGE" ]; then
            echo "No AppImage found — skipping upx"
            exit 0
          fi
          BEFORE=$(stat -c%s "$APPIMAGE")
          echo "Before upx: $((BEFORE / 1024 / 1024)) MB"
          upx --best --lzma "$APPIMAGE" || echo "upx failed (non-fatal)"
          AFTER=$(stat -c%s "$APPIMAGE")
          echo "After upx:  $((AFTER / 1024 / 1024)) MB"

      - name: List build outputs
        if: always()
        shell: bash
        working-directory: BreezeLauncherPC
        run: |
          echo "=== bin/ ==="
          find bin -type f 2>/dev/null || echo "(no bin files)"
          echo "=== NSIS installer ==="
          find build/windows/nsis -name '*-installer.exe' -type f 2>/dev/null || echo "(no nsis)"

      # ── Upload to the `artifact` rolling release ──────────────────
      # All bundle files (exe, deb, rpm, AppImage, dmg) are uploaded
      # to the same rolling release tag, replacing any previous versions.
      - name: Ensure artifact release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release create ${{ env.ARTIFACT_RELEASE_TAG }} \
            --repo "${{ github.repository }}" \
            --title "BreezeLauncher Desktop Build Artifacts" \
            --notes "Automated build artifacts from CI. The latest desktop installers are always attached to this release." \
            --draft=false --prerelease=false 2>/dev/null || gh release view ${{ env.ARTIFACT_RELEASE_TAG }} --repo "${{ github.repository }}" >/dev/null

      - name: Upload assets to artifact release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        working-directory: BreezeLauncherPC
        run: |
          shopt -s nullglob
          FILES=()

          case "${{ runner.os }}" in
            Windows)
              # Portable exe + NSIS installer (both land in bin/)
              for exe in bin/*.exe; do
                FILES+=("$exe")
              done
              ;;
            Linux)
              FILES+=(
                bin/*.deb
                bin/*.rpm
                bin/*.AppImage
              )
              ;;
            macOS)
              FILES+=(
                bin/*.dmg
              )
              ;;
          esac

          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No installable artifacts found"
            exit 0
          fi

          for f in "${FILES[@]}"; do
            BASENAME=$(basename "$f")
            # Normalize names to stable, user-friendly defaults.
            case "$BASENAME" in
              breeze.exe)
                NEWNAME="BreezeLauncher.exe"
                ;;
              *-installer.exe)
                # breeze-amd64-installer.exe -> BreezeLauncher-setup.exe
                NEWNAME="BreezeLauncher-setup.exe"
                ;;
              *)
                # Strip version numbers from deb/rpm/AppImage/dmg so assets
                # are stable across releases.
                # breeze_0.1.0_amd64.deb -> breeze_amd64.deb
                # breeze-0.1.0.x86_64.rpm -> breeze-x86_64.rpm
                # breeze-0.1.0-x86_64.AppImage -> breeze-x86_64.AppImage
                # breeze-0.1.0.dmg -> breeze.dmg
                NEWNAME=$(echo "$BASENAME" | sed -E 's/[-_]?[0-9]+\.[0-9]+\.[0-9]+[-_]?//g')
                # Prefix macOS dmgs with arch for clarity.
                if [ "${{ runner.os }}" = "macOS" ]; then
                  case "$NEWNAME" in
                    breeze.dmg)
                      if [ "${{ matrix.rid }}" = "macos-arm64" ]; then
                        NEWNAME="BreezeLauncher-arm64.dmg"
                      else
                        NEWNAME="BreezeLauncher-x64.dmg"
                      fi
                      ;;
                  esac
                fi
                # Capitalize for consistency.
                case "$NEWNAME" in
                  breeze_*.deb) NEWNAME="BreezeLauncher-${NEWNAME#breeze_}" ;;
                  breeze-*.rpm) NEWNAME="BreezeLauncher-${NEWNAME#breeze-}" ;;
                  breeze-*.AppImage) NEWNAME="BreezeLauncher-${NEWNAME#breeze-}" ;;
                esac
                ;;
            esac
            if [ "$NEWNAME" != "$BASENAME" ]; then
              cp "$f" "/tmp/$NEWNAME"
              f="/tmp/$NEWNAME"
            fi
            echo "Uploading $NEWNAME..."
            # Delete any existing asset with the same name first, then
            # upload. Retry up to 3 times to handle the race where
            # parallel platform jobs upload to the same rolling release.
            for attempt in 1 2 3; do
              gh release delete-asset ${{ env.ARTIFACT_RELEASE_TAG }} "$NEWNAME" --repo "${{ github.repository }}" --yes 2>/dev/null || true
              if gh release upload ${{ env.ARTIFACT_RELEASE_TAG }} "$f" --clobber --repo "${{ github.repository }}" 2>/dev/null; then
                echo "  uploaded (attempt $attempt)"
                break
              fi
              echo "  attempt $attempt failed, retrying in $((attempt * 5))s..."
              sleep $((attempt * 5))
            done
          done
          echo "All assets uploaded."

name: 'Desktop CI'

# This workflow lives in the public BreezeLauncherPCBuild repo purely to
# consume GitHub Actions free minutes (public repos get unlimited minutes;
# private repos are capped at 2000/min/month).
# Source code is cloned from the private BreezeLauncherPC repo at build time.
#
# Triggers:
#   repository_dispatch (auto, fired by BreezeLauncherBackend webhook
#     when the private BreezeLauncherPC repo is pushed):
#     Builds all platforms and uploads to the `artifact` rolling release.
#   workflow_dispatch (manual): same build, for ad-hoc triggers.
#
# Build outputs:
#   win-x64     -> BreezeLauncher-setup.exe        (Inno Setup installer)
#   linux-x64   -> breezelauncher_<ver>_amd64.deb + BreezeLauncher-<ver>-1.x86_64.rpm
#   linux-arm64 -> breezelauncher_<ver>_arm64.deb + BreezeLauncher-<ver>-1.aarch64.rpm
# All assets are published to THIS repo's `artifact` rolling release.

on:
  workflow_dispatch:
  repository_dispatch:
    types: [upstream-changed]

env:
  ARTIFACT_RELEASE_TAG: "artifact"
  PRIVATE_REPO: "wisebreeze/BreezeLauncherPC"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_GENERATE_ASPNET_CERTIFICATE: "false"

jobs:
  build:
    name: Build ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-22.04
            rid: linux-x64
          - os: ubuntu-22.04
            rid: linux-arm64

    steps:
      - name: Checkout private source repo
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        shell: bash
        run: |
          git clone --filter=blob:none --depth 1 --branch main "https://x-access-token:${PRIVATE_REPO_TOKEN}@github.com/${PRIVATE_REPO}.git" .
          git config user.name "wisebreeze"
          git config user.email "wisebreeze@users.noreply.github.com"

      - name: Read version from csproj
        id: version
        shell: bash
        run: |
          VERSION=$(grep -oP '<Version>\K[^<]+' BreezeLauncherPC.csproj || echo "0.0.0")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"

      - name: Cache .NET SDK
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.tool_cache }}/dotnet
            ${{ runner.tool_cache }}/dncs
            ~/.dotnet
          key: dotnet-sdk-10.0.x-${{ runner.os }}-v1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore NuGet packages
        shell: bash
        run: dotnet restore

      - name: Publish (framework-dependent for testing)
        shell: bash
        run: |
          # Framework-dependent: relies on system .NET 10 Desktop Runtime.
          # Package is ~30MB instead of ~80MB. Switch to --self-contained true
          # for production releases so users don't need to install .NET.
          dotnet publish -c Release -r ${{ matrix.rid }} --self-contained false -p:PublishSingleFile=true -p:DebugType=embedded -o publish --no-restore

      # ── Windows: Inno Setup (pre-installed, skip detection) ────────
      # Must run AFTER dotnet publish so publish/ directory exists.
      - name: Build exe installer
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          cd packaging/windows
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
          Move-Item BreezeLauncher-setup.exe ../../BreezeLauncher-setup.exe -Force

      # ── Linux: .deb + .rpm via fpm ────────────────────────────────
      - name: Install fpm
        if: startsWith(matrix.rid, 'linux')
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ruby ruby-dev rpm
          sudo gem install fpm --no-document

      - name: Build deb and rpm packages
        if: startsWith(matrix.rid, 'linux')
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          chmod +x packaging/linux/build-packages.sh
          packaging/linux/build-packages.sh "${{ matrix.rid }}" "$VERSION"

      - name: List build outputs
        shell: bash
        run: |
          echo "=== Build outputs ==="
          ls -lh BreezeLauncher-setup.exe *.deb *.rpm 2>/dev/null || echo "(no files found)"

      - name: Ensure artifact release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release create ${{ env.ARTIFACT_RELEASE_TAG }} \
            --repo "${{ github.repository }}" \
            --title "BreezeLauncher Desktop Build Artifacts" \
            --notes "Automated build artifacts from CI. The latest desktop installers are always attached to this release." \
            --draft=false --prerelease=false 2>/dev/null || gh release view ${{ env.ARTIFACT_RELEASE_TAG }} --repo "${{ github.repository }}" >/dev/null

      - name: Upload assets to artifact release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          for f in BreezeLauncher-setup.exe *.deb *.rpm; do
            [ -f "$f" ] || continue
            echo "Uploading $f..."
            gh release delete-asset ${{ env.ARTIFACT_RELEASE_TAG }} "$f" --repo "${{ github.repository }}" 2>/dev/null || true
            gh release upload ${{ env.ARTIFACT_RELEASE_TAG }} "$f" --clobber --repo "${{ github.repository }}"
          done
          echo "All assets uploaded."

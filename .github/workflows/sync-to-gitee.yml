name: Sync PC config to Gitee

on:
  push:
    branches: [main]
    paths:
      - 'config/**'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout BreezeLauncherDesktop
        uses: actions/checkout@v4

      - name: Sync config/ to Gitee pc/
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -e
          git clone "https://wisebreeze:${GITEE_TOKEN}@gitee.com/wisebreeze/BreezeLauncherApp.git" gitee-repo
          cd gitee-repo
          git config user.name "wisebreeze"
          git config user.email "12232263+wisebreeze@user.noreply.gitee.com"
          rm -rf pc
          mkdir -p pc
          cp -r ../config/* pc/
          git add pc
          if git diff --cached --quiet; then
            echo "No changes to sync"
          else
            git commit -m "chore(pc-config): sync from BreezeLauncherDesktop"
            git push origin main
          fi

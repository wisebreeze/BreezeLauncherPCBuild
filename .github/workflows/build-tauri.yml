name: 'Tauri Build (test)'

# Test build for the Tauri migration preview. Clones the private
# BreezeLauncherPC repo and runs `cargo check` + `npm run build` on
# Windows, Linux, and macOS to verify the code compiles on all three
# platforms — especially the platform-specific accent color code
# (WinRT on Windows, NSColor/NSDistributedNotificationCenter on macOS,
# gsettings on Linux).
#
# This workflow does NOT produce release artifacts. It's a compile
# gate: if any platform fails to build, the run is marked failed.
#
# Triggers:
#   workflow_dispatch (manual): ad-hoc, optionally on a specific ref.
#   repository_dispatch (auto, fired by BreezeLauncherBackend webhook
#     when the private BreezeLauncherPC repo is pushed): same build.
#
# Runner pre-installed software (no setup actions needed):
#   - Node.js 20/22 (we still use setup-node for the npm cache).
#   - Rust stable via rustup (we still use rust-toolchain for caching
#     and to pin a consistent toolchain across runs).
#   - Linux: webkit2gtk, gtk3, etc. are NOT pre-installed — apt step
#     is required.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch / tag / commit SHA in BreezeLauncherPC to build from'
        required: false
        default: 'main'
  repository_dispatch:
    types: [upstream-changed]

env:
  PRIVATE_REPO: 'wisebreeze/BreezeLauncherPC'

jobs:
  build:
    name: Build ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-22.04
            rid: linux-x64
          - os: macos-latest
            rid: macos-universal

    steps:
      - name: Checkout private source repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          ref: ${{ github.event.inputs.ref || 'main' }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: BreezeLauncherPC
          fetch-depth: 1

      # Node.js is pre-installed on the runner, but setup-node gives us
      # the npm cache for free (keyed on package-lock.json hash).
      - name: Setup Node.js (with npm cache)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: BreezeLauncherPC/package-lock.json

      # Rust is pre-installed via rustup, but rust-toolchain pins a
      # consistent version and integrates with Swatinem/rust-cache.
      - name: Setup Rust (with target cache)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'BreezeLauncherPC/src-tauri'
          key: ${{ matrix.rid }}

      # Linux: Tauri requires webkit2gtk and other system deps that are
      # NOT pre-installed on the runner image. Cache the apt downloads
      # so subsequent runs skip re-downloading (install still runs, but
      # packages come from the cache instead of the Ubuntu mirrors).
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: |
            libwebkit2gtk-4.1-dev
            libgtk-3-dev
            libayatana-appindicator3-dev
            librsvg2-dev
            patchelf
          version: v1
          # Cache keyed on the package list + Ubuntu version. Hits on
          # subsequent runs within the 7-day default ttl.
          refresh: true

      - name: Install npm dependencies
        working-directory: BreezeLauncherPC
        run: npm ci

      # Frontend type-check + build (tsc --noEmit && vite build).
      - name: Build frontend
        working-directory: BreezeLauncherPC
        run: npm run build

      # Cargo check verifies the Rust code compiles for the host target.
      # Faster than `cargo build` — skips linking. Catches API misuse
      # (wrong objc2 method signatures, missing features, etc.).
      - name: Cargo check (Rust backend)
        working-directory: BreezeLauncherPC/src-tauri
        run: cargo check --all-targets

      # Full Tauri build (frontend + Rust + bundle). This is the real
      # test — if the platform-specific accent code has any issue
      # (wrong objc2 API, missing feature flag, etc.), this step fails.
      - name: Tauri build
        working-directory: BreezeLauncherPC
        run: npm run tauri build
        env:
          # CI builds don't need code signing for the compile test.
          # macOS: skip signing/notarization.
          APPLE_SIGNING_ENABLED: 'false'
          # Windows: skip code signing.
          TAURI_SIGNING_PRIVATE_KEY: ''

      # Compress the Linux AppImage with upx. AppImage bundles the full
      # webkit2gtk runtime (~50MB) so the uncompressed image is ~77MB.
      # upx --best --lzma typically shrinks it 50-60%.
      # Only run on Linux where AppImage is produced.
      - name: Compress AppImage with upx
        if: runner.os == 'Linux'
        shell: bash
        working-directory: BreezeLauncherPC
        run: |
          # Find the AppImage (name includes version, so glob it).
          APPIMAGE=$(find src-tauri/target/release/bundle/appimage -name '*.AppImage' -type f | head -1)
          if [ -z "$APPIMAGE" ]; then
            echo "No AppImage found — skipping upx"
            exit 0
          fi
          BEFORE=$(stat -c%s "$APPIMAGE")
          echo "Before upx: $((BEFORE / 1024 / 1024)) MB ($APPIMAGE)"
          # Install upx via apt (fast, ~1MB).
          sudo apt-get install -y -qq upx-ucl
          # --best: highest compression. --lzma: use LZMA (slower but smaller).
          # upx doesn't compress well on already-stripped binaries, but the
          # webkit2gtk shared libs inside the AppImage compress well.
          upx --best --lzma "$APPIMAGE" || echo "upx failed (non-fatal)"
          AFTER=$(stat -c%s "$APPIMAGE")
          echo "After upx:  $((AFTER / 1024 / 1024)) MB"
          echo "Saved:      $(((BEFORE - AFTER) / 1024 / 1024)) MB ($(( (BEFORE - AFTER) * 100 / BEFORE ))%)"

      - name: List build outputs
        if: always()
        shell: bash
        working-directory: BreezeLauncherPC
        run: |
          echo "=== Tauri build outputs ==="
          find src-tauri/target/release/bundle -type f 2>/dev/null | head -20 || echo "(no bundle files)"
